<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Connection</title>
</head>
<body>
    <h1>Test API Connection</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            <!-- const apiUrl = 'http://192.168.1.149:8000/api/v1'; -->
            const apiUrl = 'https://admin.cleanestuaire.com/api/v1';
            console.log('Testing URL:', apiUrl);
            
            try {
                // Test 1: Basic connection
                const response1 = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('Response:', response1);
                resultDiv.innerHTML += '<br>Connection status: ' + response1.status;
                
                // Test 2: Register endpoint
                const registerUrl = apiUrl + '/auth/register';
                console.log('Testing register:', registerUrl);
                
                const testData = {
                    name: 'Test User',
                    email: `test${Date.now()}@example.com`,
                    password: 'Password123',
                    password_confirmation: 'Password123'
                };
                
                const response2 = await fetch(registerUrl, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });
                
                const data = await response2.json();
                console.log('Register response:', data);
                resultDiv.innerHTML += '<br>Register response: <pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML += '<br>Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
